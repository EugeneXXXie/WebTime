<!doctype html>
<html lang="en" data-theme="dark" data-motion="full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WebTime</title>
    <link rel="icon" href="../assets/icons/icon32.png" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar enter">
      <a class="brand" href="#today"
        ><span class="logo" aria-hidden="true"></span>WebTime</a
      >
      <nav aria-label="Main navigation">
        <span class="nav-indicator"></span
        ><a href="#today" data-page="today">Today</a
        ><a href="#week" data-page="week">7 Days</a
        ><a href="#month" data-page="month">30 Days</a
        ><a href="#websites" data-page="websites">Websites</a>
      </nav>
      <a
        class="settings-link"
        href="../settings/index.html"
        aria-label="Settings"
        ><svg
          width="19"
          height="19"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z" />
          <circle cx="12" cy="12" r="3" /></svg
      ></a>
    </header>
    <main id="app" aria-label="Browser time statistics">
      <p class="empty">Loading your time…</p>
    </main>
    <footer>
      <span>YOUR TIME. YOUR DEVICE.</span
      ><span>Stored locally · No account · No tracking</span>
    </footer>
    <script type="module" src="app.js"></script>
  </body>
</html>
